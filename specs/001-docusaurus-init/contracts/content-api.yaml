# API Contract: NeuroBot Textbook Content API

**Feature**: 001-docusaurus-init
**Version**: 1.0
**Date**: 2025-12-15

## Overview

This contract defines the content API endpoints for the NeuroBot Docusaurus textbook. These endpoints will be implemented in future features to support the RAG chatbot and dynamic content features. This initial contract establishes the foundation for content retrieval and search functionality.

## Base URL

```
https://mominkhanx.github.io/neurobot-textbook/api
```

Note: For static site deployment, these endpoints will be implemented as client-side JavaScript functions that query the static content or external services.

## Content Retrieval Endpoints

### GET /modules

Retrieve a list of all available modules in the textbook.

#### Request

```
GET /modules
Content-Type: application/json
```

#### Response

**Success Response (200 OK)**

```json
{
  "modules": [
    {
      "id": "introduction",
      "title": "Introduction to Physical AI",
      "description": "Overview of Physical AI and humanoid robotics concepts",
      "position": 1,
      "chapterCount": 3,
      "slug": "introduction"
    },
    {
      "id": "module-1-ros2",
      "title": "The Robotic Nervous System (ROS 2)",
      "description": "ROS 2 architecture and implementation",
      "position": 2,
      "chapterCount": 5,
      "slug": "module-1-ros2"
    },
    {
      "id": "module-2-digital-twin",
      "title": "The Digital Twin (Gazebo & Unity)",
      "description": "Simulation environments and digital twins",
      "position": 3,
      "chapterCount": 4,
      "slug": "module-2-digital-twin"
    },
    {
      "id": "module-3-nvidia-isaac",
      "title": "The AI-Robot Brain (NVIDIA Isaac™)",
      "description": "AI-powered robotics with NVIDIA Isaac",
      "position": 4,
      "chapterCount": 5,
      "slug": "module-3-nvidia-isaac"
    },
    {
      "id": "module-4-vla",
      "title": "Vision-Language-Action (VLA)",
      "description": "Multimodal AI for robotics",
      "position": 5,
      "chapterCount": 5,
      "slug": "module-4-vla"
    }
